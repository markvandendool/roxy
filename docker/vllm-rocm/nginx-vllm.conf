events {
    worker_connections 1024;
}

http {
    upstream vllm_backend {
        # Weighted load balancing based on GPU capability
        # 6900XT is primary, W5700X is fallback
        server vllm-6900xt:8000 weight=3 max_fails=3 fail_timeout=30s;
        server vllm-w5700x:8000 weight=1 backup;
    }

    server {
        listen 80;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # vLLM API endpoints
        location / {
            proxy_pass http://vllm_backend;
            proxy_http_version 1.1;
            
            # Streaming support
            proxy_buffering off;
            proxy_cache off;
            
            # Timeouts for long inference
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Metrics endpoint
        location /metrics {
            proxy_pass http://vllm-6900xt:8000/metrics;
            allow 10.0.0.0/8;  # Internal only
            deny all;
        }
    }
}
